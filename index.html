<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - UNA Cafetería Librería</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #121212;
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #1a1a1a;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 600;
        }
        .actions a {
            color: #fff;
            background-color: #e50914;
            padding: 0.5rem 1rem;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }
        .actions a:hover {
            background-color: #b80710;
        }
        .pdf-container {
            flex: 1;
            width: 100%;
            height: calc(100vh - 60px);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>UNA - Cafetería & Librería</h1>
        <div class="actions">
            <a href="menu.pdf" download>Descargar PDF</a>
        </div>
    </header>
    <div class="pdf-container">
        <iframe src="menu.pdf" type="application/pdf">
            <p>Tu navegador no soporta la visualización de PDF. Puedes <a href="menu.pdf">descargarlo aquí</a>.</p>
        </iframe>
    </div>
</body>
</html>
