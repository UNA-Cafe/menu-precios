<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Menú - UNA Libro Café">
  <title>UNA Libro Café - Menú</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    .pdf-viewer {
      width: 100vw;
      height: 100vh;
      border: 0;
      display: block;
    }

    .fallback {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
    }

    .fallback a {
      color: #fff;
      background: #333;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <iframe
    class="pdf-viewer"
    src="menu.pdf#view=FitH&toolbar=0&navpanes=0&scrollbar=0"
    title="Menú UNA Libro Café">
  </iframe>

  <noscript>
    <div class="fallback">
      <p>Necesitás JavaScript para visualizar el menú.</p>
      <a href="menu.pdf">Abrir el menú en PDF</a>
    </div>
  </noscript>
</body>
</html>
